  <rect x="101" y="156" width="80" height="24" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#7dd3fc" stroke-opacity="0.35"/><text x="141.0" y="172" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7dd3fc">LightGBM</text>
  <rect x="189" y="156" width="73" height="24" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#7dd3fc" stroke-opacity="0.35"/><text x="225.5" y="172" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7dd3fc">FastAPI</text>
  <rect x="270" y="156" width="51" height="24" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#7dd3fc" stroke-opacity="0.35"/><text x="295.5" y="172" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7dd3fc">Nuxt</text>
