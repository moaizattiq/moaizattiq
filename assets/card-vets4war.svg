<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-label="Vets4Warriors Forecast: 89–94% daily accuracy">
  <defs>
    <linearGradient id="bg-vets4war" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="accent-vets4war" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45"/><stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <pattern id="grid-vets4war" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%,100% { stroke-opacity: .25; } 50% { stroke-opacity: .7; } }
  </style>
  <rect x="1" y="1" width="478" height="198" rx="16" fill="url(#bg-vets4war)"/>
  <rect x="1" y="1" width="478" height="198" rx="16" fill="url(#grid-vets4war)"/>
  <rect class="glow" x="1" y="1" width="478" height="198" rx="16" fill="none" stroke="url(#accent-vets4war)" stroke-width="2"/>
  <rect x="28" y="0" width="56" height="4" rx="2" fill="url(#accent-vets4war)"/>
  <text x="28" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#ff7a45">UT Dallas EPICS · Project lead</text>
  <text x="28" y="76" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#e6edf3">Vets4Warriors Forecast</text>
  <text x="28" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#7dd3fc">89–94% daily accuracy</text>
  <text x="28" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b98b5">Forecasts calls to a 24/7 veteran support line and</text>
  <text x="28" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b98b5">turns them into staffing.</text>
